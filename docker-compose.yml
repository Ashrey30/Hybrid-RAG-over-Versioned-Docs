services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  api:
    build: .
    depends_on: [qdrant]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./data:/app/data
volumes:
  qdrant_data:
  hf_cache:
